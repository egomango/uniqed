[metadata]
name = uniqed
version = 0.1.0
license = Simplified BSD
description = Simple implementation of the Temporal Outlier Factor
long_description = file: README.rst
author = Zsigmond Benko, Tamas Babel, Zoltan Somogyvari
author_email = benko.zsigmond@gmail.com
url = https://github.com/egomango/uniqed
project_urls =
   Source = https://github.com/egomango/uniqed
   Issues = https://github.com/egomango/uniqed/issues
   Changelog = https://github.com/egomango/uniqed/blob/master/CHANGELOG.md
classifiers=
   Intended Audience :: Science/Research
   Topic :: Scientific/Engineering :: Mathematics
   Topic :: Scientific/Engineering :: Medical Science Apps.
   Topic :: Scientific/Engineering :: Physics
   Topic :: Scientific/Engineering :: Astronomy

[options]
packages = find:
package_dir =
    =src
include_package_data = True
install_requires =
   numpy
   scipy
   scikit-learn
   pandas
   matplotlib

[options.packages.find]
where=src

[tool:pytest]
testpaths = tests
markers =
    slow: needs the git-LFS simulation payload; deselected by default, run with -m slow
addopts = -m "not slow"
